<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1110" />
      <stop offset="100%" stop-color="#030706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E1B" />
      <stop offset="100%" stop-color="#0B1110" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Vault Shield Contour -->
  <path
    d="M 256 70
       L 390 120
       C 390 270 340 375 256 438
       C 172 375 122 270 122 120
       Z"
    fill="url(#shieldGrad)"
    stroke="#1F2E2A"
    stroke-width="12"
  />

  <!-- Subtle Inner Shield Ring -->
  <path
    d="M 256 100
       L 366 142
       C 366 264 324 350 256 405
       C 188 350 146 264 146 142
       Z"
    fill="none"
    stroke="#10B981"
    stroke-width="4"
    stroke-opacity="0.3"
  />

  <!-- Dynamic Pace Chevrons (Upward & Forward Momentum) -->
  <path
    d="M 195 285 L 256 224 L 317 285"
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 215 340 L 256 299 L 297 340"
    fill="none"
    stroke="#10B981"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.6"
  />
  <circle cx="256" cy="180" r="16" fill="#10B981" />
</svg>
