name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Configure Android SDK Licenses & Environment
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b68256927903a6f786504046cb2e9e\n89338d0d9b183fb97af1110d21247c2126fb1f20\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a2a0e23e25d2b7ac535c8e2354c\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log || {
            echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/VaultPace-v1.0.0-debug.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultPace-Android-APK
          path: build-output/VaultPace-v1.0.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "VaultPace v1.0.0 Android Release"
          body: |
            ## VaultPace v1.0.0 (Android APK)
            
            - **Privacy-first**: Zero bank logins, zero telemetry, 100% offline local storage.
            - **Burn rate pacing**: Real-time "Today" marker on monthly and weekly budgets.
            - **Multi-currency**: Complete support for INR (₹), USD, EUR, GBP, CAD, AUD, JPY.
            - **3-Click quick logging**: Smart increment chips.
            
            ### Installation:
            1. Download `VaultPace-v1.0.0-debug.apk` to your Android device.
            2. Tap the downloaded file to install (allow "Install from Unknown Sources" if prompted).
          files: build-output/VaultPace-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish Success Step Summary
        if: success()
        run: |
          echo "## 🎉 VaultPace Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Debug APK has been compiled, packaged, and verified." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 How to Download & Install:" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
          echo "2. Download **VaultPace-Android-APK**." >> $GITHUB_STEP_SUMMARY
          echo "3. Open on your Android phone and install." >> $GITHUB_STEP_SUMMARY
